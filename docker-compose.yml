services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    container_name: day02_app
    working_dir: /var/www
    volumes:
      - .:/var/www                    # código fuente — sin volumen vendor separado
    depends_on:
      db:
        condition: service_healthy
    networks: [day02_net]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: day02_nginx
    ports: ["${APP_PORT:-8080}:80"]
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [day02_net]
    restart: unless-stopped

  db:
    image: mysql:8.0.28
    container_name: day02_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-day02_db}
      MYSQL_USER: ${DB_USERNAME:-day02}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports: ["${DB_PORT:-3306}:3306"]
    volumes:
      - db_data:/var/lib/mysql
    networks: [day02_net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  day02_net:
    driver: bridge

volumes:
  db_data:
  